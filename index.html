<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>给廖礼《锦秀春晖》投票</title>
  <style>
    :root {
      --brand: #c0392b;
      --brand-dark: #a93226;
      --gold: #d4af37;
      --ink: #2c2c2c;
      --muted: #8a8a8a;
      --bg: #faf7f2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    .wrap { flex: 1; width: 100%; max-width: 460px; margin: 0 auto; padding: 20px 16px 32px; }

    /* 顶部横幅 */
    .banner {
      background: linear-gradient(135deg, #7a1f1f 0%, var(--brand) 55%, #d35400 100%);
      color: #fff; border-radius: 16px; padding: 20px 18px; text-align: center;
      box-shadow: 0 8px 24px rgba(160, 40, 40, .28);
    }
    .banner .sub { font-size: 12px; letter-spacing: 2px; opacity: .85; margin-bottom: 6px; }
    .banner h1 { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
    .banner .rule {
      margin-top: 10px; font-size: 12.5px; opacity: .92; line-height: 1.6;
      background: rgba(255,255,255,.12); border-radius: 10px; padding: 8px 10px;
    }

    /* 作品卡 */
    .card {
      background: #fff; border-radius: 16px; margin-top: 16px; overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,.06);
    }
    .card .art { width: 100%; display: block; aspect-ratio: 3/2; object-fit: cover; background: #eee; }
    .card .body { padding: 14px 16px; }
    .card .title { font-size: 18px; font-weight: 700; }
    .card .author { margin-top: 4px; color: var(--muted); font-size: 14px; }
    .card .author b { color: var(--ink); font-weight: 600; }

    /* 票数 */
    .votes {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 14px; padding: 12px; background: #fffdf5;
      border: 1px solid #f0e6c8; border-radius: 12px;
    }
    .votes .num { font-size: 34px; font-weight: 800; color: var(--brand); font-variant-numeric: tabular-nums; line-height: 1; }
    .votes .lbl { font-size: 13px; color: var(--muted); }
    .votes .refresh { font-size: 12px; color: var(--muted); }

    /* 主按钮 */
    .btn {
      display: block; width: 100%; margin-top: 18px; padding: 16px; border: 0; border-radius: 14px;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
      color: #fff; font-size: 18px; font-weight: 700; letter-spacing: 2px; cursor: pointer;
      box-shadow: 0 6px 18px rgba(192, 57, 43, .35);
      transition: transform .1s ease, box-shadow .2s ease;
    }
    .btn:active { transform: scale(.98); box-shadow: 0 3px 10px rgba(192, 57, 43, .3); }
    .btn.loading { opacity: .7; }

    /* 提示区 */
    .tip {
      margin-top: 14px; font-size: 13px; color: var(--muted); line-height: 1.7;
      background: #f1f1f1; border-radius: 12px; padding: 12px 14px;
    }
    .tip .warn { color: #b7791f; font-weight: 600; }

    /* 分享指引 */
    .share { margin-top: 20px; }
    .share h2 { font-size: 15px; color: var(--ink); margin-bottom: 8px; }
    .share .steps { list-style: none; counter-reset: s; }
    .share .steps li {
      counter-increment: s; position: relative; padding-left: 34px; margin-bottom: 10px;
      font-size: 13.5px; line-height: 1.6; color: #555;
    }
    .share .steps li::before {
      content: counter(s); position: absolute; left: 0; top: 1px;
      width: 22px; height: 22px; border-radius: 50%; background: var(--gold); color: #fff;
      font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    }
    .copy-link {
      margin-top: 12px; display: flex; gap: 8px;
    }
    .copy-link input {
      flex: 1; border: 1px solid #ddd; border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #555;
      background: #fff; outline: none;
    }
    .copy-link button {
      border: 0; border-radius: 10px; padding: 0 16px; background: var(--ink); color: #fff; font-size: 13px; cursor: pointer;
    }
    .copy-link button:active { opacity: .8; }

    .foot { text-align: center; font-size: 11px; color: #bbb; margin-top: 24px; }
    .toast {
      position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%);
      background: rgba(0,0,0,.8); color: #fff; font-size: 13px; padding: 10px 18px; border-radius: 20px;
      opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 999;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="banner">
      <div class="sub">“翰墨”老年书画展投票活动</div>
      <h1>给廖礼投一票</h1>
      <div class="rule">每天 1 票 · 每人每天可投 5 个不同作品<br />投票时间：10月01日 10:00 — 10月08日 24:00</div>
    </div>

    <div class="card">
      <img class="art" id="art-img" alt="《锦秀春晖》" />
      <div class="body">
        <div class="title">《锦秀春晖》</div>
        <div class="author">作者：<b>廖礼</b>　<span id="art-no">作品序号 428</span></div>
      </div>
    </div>

    <div class="votes">
      <span class="num" id="vote-num">—</span>
      <span class="lbl">票</span>
      <span class="refresh" id="vote-time"></span>
    </div>

    <button class="btn" id="vote-btn">给廖礼投一票</button>

    <div class="tip" id="tip">
      <span class="warn">请使用微信打开本页面。</span><br />
      点击按钮后会自动跳转到官方授权页；授权返回后，在官方页面点一下「投票」即可完成（投给《锦秀春晖》）。
    </div>

    <div class="share">
      <h2>📣 帮廖礼拉票，三步走</h2>
      <ol class="steps">
        <li>把本页链接发到微信群 / 朋友圈，请大家<b>用微信打开</b>。</li>
        <li>每人点一下「给廖礼投一票」，跳转官方授权并投票。</li>
        <li><b>每天点一次</b>，一人一天最多给廖礼 +1 票。</li>
      </ol>
      <div class="copy-link">
        <input id="page-url" readonly />
        <button id="copy-btn">复制链接</button>
      </div>
    </div>

    <div class="foot">本页面仅为拉票落地页 · 投票数据来自官方接口</div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* ===================== 配置区（如需改动只改这里） ===================== */
    var CONFIG = {
      voteId: 205,           // 活动 ID
      itemId: 14311,         // 廖礼《锦秀春晖》的作品 ID（序号 428）
      itemName: '《锦秀春晖》',
      author: '廖礼',
      // 官方 appid（四川观察服务号）。不能改成别的，否则 code 换不出 token。
      wechatAppId: 'wxdf37c795d47681c3',
      // 官方投票详情页（授权后落地页）。授权会自动带 code，详情页会读取 item_id 展示投票按钮。
      officialDetailUrl: 'https://screen.scgchc.com/scgc_activity/vote/default/detail.html?vote_id=205&item_id=14311',
      // 票数实时来源（官方公开接口）
      listApi: 'https://vote.scgchc.com/index/vote_api/getList'
    };
    /* ===================================================================== */

    // ---- 实时票数（拉官方 getList 找到目标作品） ----
    function fetchVotes() {
      var fd = new FormData();
      fd.append('vote_id', CONFIG.voteId);
      fd.append('order', '0');
      var xhr = new XMLHttpRequest();
      xhr.open('POST', CONFIG.listApi, true);
      xhr.onload = function () {
        if (xhr.status !== 200) { setNum(null); return; }
        try {
          var j = JSON.parse(xhr.responseText);
          var list = (j && j.data && j.data.list) || [];
          var item = null;
          for (var i = 0; i < list.length; i++) {
            if (String(list[i].id) === String(CONFIG.itemId)) { item = list[i]; break; }
          }
          if (item) {
            setNum(item.total);
            if (item.img) document.getElementById('art-img').src = item.img;
          } else {
            setNum(null);
          }
        } catch (e) { setNum(null); }
      };
      xhr.onerror = function () { setNum(null); };
      xhr.send(fd);
    }

    function setNum(n) {
      var el = document.getElementById('vote-num');
      var t = document.getElementById('vote-time');
      if (n === null || n === undefined) { el.textContent = '—'; }
      else { el.textContent = n; }
      t.textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }

    // ---- 一键授权跳转 ----
    function buildAuthUrl() {
      var redirect = CONFIG.officialDetailUrl;
      return 'https://open.weixin.qq.com/connect/oauth2/authorize'
        + '?appid=' + CONFIG.wechatAppId
        + '&redirect_uri=' + encodeURIComponent(redirect)
        + '&response_type=code'
        + '&scope=snsapi_base'
        + '&state=vote_' + CONFIG.itemId
        + '#wechat_redirect';
    }

    var btn = document.getElementById('vote-btn');
    btn.addEventListener('click', function () {
      if (btn.classList.contains('loading')) return;
      btn.classList.add('loading');
      btn.textContent = '正在跳转…';
      // 直接用顶层跳转，确保微信内置浏览器完成 OAuth
      window.location.href = buildAuthUrl();
    });

    // ---- 复制本页链接 ----
    var urlInput = document.getElementById('page-url');
    urlInput.value = window.location.href;
    var copyBtn = document.getElementById('copy-btn');
    function toast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(function () { t.classList.remove('show'); }, 1800);
    }
    copyBtn.addEventListener('click', function () {
      var url = window.location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () { toast('链接已复制'); }, function () { fallbackCopy(url); });
      } else { fallbackCopy(url); }
    });
    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('链接已复制'); } catch (e) { toast('请长按输入框手动复制'); }
      document.body.removeChild(ta);
    }

    // ---- 初始化 ----
    fetchVotes();
    setInterval(fetchVotes, 30000); // 每 30 秒刷新票数
  </script>
</body>
</html>
